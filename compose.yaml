services:
  neo4j:
    image: neo4j:5-community
    container_name: geolocation-neo4j

    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}

    ports:
      - "7474:7474"
      - "7687:7687"

    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

    restart: unless-stopped

  backend:
    build:
      context: ./backend

    container_name: geolocation-backend

    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}

    ports:
      - "5000:5000"

    volumes:
      - ./backend:/app

    depends_on:
      - neo4j

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend

    container_name: geolocation-frontend

    ports:
      - "8080:80"

    depends_on:
      - backend

    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs: